name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Reviewed main commit SHA (leave blank for current main)'
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  pack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::main changed after confirmation. Review the new commit and run the staging workflow again.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error

  stage:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-release
      - run: |
          tarballs=("$RUNNER_TEMP"/npm-release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo '::error::Expected exactly one npm tarball.'
            exit 1
          fi
          npm stage publish "${tarballs[0]}" --ignore-scripts
